<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Khelo India — Phone Preview</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #1C1C1E;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', sans-serif;
    gap: 24px;
    padding: 32px 16px;
  }

  /* ── toolbar ── */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #2C2C2E;
    border: 1px solid #3A3A3C;
    border-radius: 14px;
    padding: 10px 16px;
    width: 420px;
  }
  .toolbar label {
    font-size: 12px;
    font-weight: 500;
    color: #8E8E93;
    white-space: nowrap;
  }
  .toolbar input {
    flex: 1;
    background: #1C1C1E;
    border: 1px solid #3A3A3C;
    border-radius: 8px;
    padding: 6px 10px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: #F2F2F7;
    outline: none;
  }
  .toolbar input:focus { border-color: #636366; }
  .toolbar button {
    background: #F2F2F7;
    color: #1C1C1E;
    border: none;
    border-radius: 8px;
    padding: 6px 14px;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .toolbar button:hover { background: #E5E5EA; }

  /* ── route switcher ── */
  .routes {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 500px;
  }
  .route-btn {
    background: #2C2C2E;
    color: #8E8E93;
    border: 1px solid #3A3A3C;
    border-radius: 999px;
    padding: 5px 13px;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: all .15s;
  }
  .route-btn:hover { background: #3A3A3C; color: #F2F2F7; }
  .route-btn.active { background: #F2F2F7; color: #1C1C1E; border-color: #F2F2F7; }

  /* ── phone shell ── */
  .phone-wrap {
    position: relative;
    width: 393px;
  }

  .phone-shell {
    position: relative;
    width: 393px;
    height: 852px;
    background: #1A1A1A;
    border-radius: 54px;
    box-shadow:
      0 0 0 2px #3A3A3C,
      0 0 0 10px #1C1C1E,
      0 0 0 12px #3A3A3C,
      0 40px 80px rgba(0,0,0,0.7);
    overflow: hidden;
  }

  /* Side buttons */
  .phone-shell::before {
    content: '';
    position: absolute;
    left: -14px;
    top: 130px;
    width: 4px;
    height: 36px;
    background: #3A3A3C;
    border-radius: 2px 0 0 2px;
    box-shadow: 0 52px 0 #3A3A3C, 0 96px 0 #3A3A3C;
  }
  .phone-shell::after {
    content: '';
    position: absolute;
    right: -14px;
    top: 164px;
    width: 4px;
    height: 72px;
    background: #3A3A3C;
    border-radius: 0 2px 2px 0;
  }

  /* Screen bezel */
  .phone-screen {
    position: absolute;
    inset: 6px;
    border-radius: 49px;
    overflow: hidden;
    background: #F2F2F7;
  }

  /* Dynamic island */
  .dynamic-island {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 34px;
    background: #1A1A1A;
    border-radius: 20px;
    z-index: 10;
  }

  /* Status bar overlay */
  .status-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 58px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 28px 8px;
    z-index: 9;
    pointer-events: none;
  }
  .status-time {
    font-size: 15px;
    font-weight: 600;
    color: #0F0F12;
    font-family: 'Inter', sans-serif;
  }
  .status-icons {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .status-icons svg {
    width: 16px;
    height: 16px;
    fill: #0F0F12;
  }

  /* The iframe */
  iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
    border-radius: 49px;
  }

  /* ── bottom hint ── */
  .hint {
    font-size: 11px;
    color: #48484A;
    text-align: center;
    line-height: 1.6;
  }
  .hint kbd {
    background: #2C2C2E;
    border: 1px solid #3A3A3C;
    border-radius: 4px;
    padding: 1px 6px;
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    color: #8E8E93;
  }

  /* ── scale for smaller screens ── */
  @media (max-height: 980px) {
    .phone-shell { transform: scale(0.88); transform-origin: top center; }
    .phone-wrap  { height: calc(852px * 0.88 + 12px); }
  }
  @media (max-height: 860px) {
    .phone-shell { transform: scale(0.76); transform-origin: top center; }
    .phone-wrap  { height: calc(852px * 0.76 + 12px); }
  }
</style>
</head>
<body>

<!-- Toolbar -->
<div class="toolbar">
  <label>URL</label>
  <input type="text" id="urlInput"
    value="https://khelo-india.vercel.app"
    placeholder="https://your-app.vercel.app"
    style="flex:1"
  />
  <input type="hidden" id="pathInput" value="" />
  <button onclick="loadUrl()">Load ↗</button>
</div>

<!-- Quick route switcher -->
<div class="routes">
  <span style="font-size:11px;color:#48484A;margin-right:4px">Quick jump:</span>

  <!-- Onboarding -->
  <button class="route-btn" onclick="goRoute('/onboarding/language', this)">Language</button>
  <button class="route-btn" onclick="goRoute('/onboarding/profile', this)">Profile</button>
  <button class="route-btn" onclick="goRoute('/onboarding/location', this)">Location</button>
  <button class="route-btn" onclick="goRoute('/onboarding/transparency', this)">Privacy</button>

  <!-- Main tabs -->
  <button class="route-btn active" onclick="goRoute('/discover', this)">Discover</button>
  <button class="route-btn" onclick="goRoute('/learn', this)">Learn</button>
  <button class="route-btn" onclick="goRoute('/play', this)">Play</button>
  <button class="route-btn" onclick="goRoute('/getfit', this)">Get Fit</button>
  <button class="route-btn" onclick="goRoute('/myspace', this)">My Space</button>

  <!-- Sub-screens -->
  <button class="route-btn" onclick="goRoute('/learn/Badminton', this)">Sport Detail</button>
  <button class="route-btn" onclick="goRoute('/play/facilities/Badminton', this)">Facilities</button>
  <button class="route-btn" onclick="goRoute('/play/facility/1', this)">Facility Detail</button>
  <button class="route-btn" onclick="goRoute('/getfit/test/1', this)">Test Card</button>
  <button class="route-btn" onclick="goRoute('/getfit/results', this)">Results</button>
  <button class="route-btn" onclick="goRoute('/challenges', this)">Challenges</button>
  <button class="route-btn" onclick="goRoute('/play/event/1/register', this)">Event Reg.</button>
  <button class="route-btn" onclick="goRoute('/myspace/streak', this)">Streak</button>
  <button class="route-btn" onclick="goRoute('/myspace/settings', this)">Settings</button>
</div>

<!-- Phone frame -->
<div class="phone-wrap">
  <div class="phone-shell">
    <div class="phone-screen">
      <!-- Dynamic island -->
      <div class="dynamic-island"></div>

      <!-- Status bar -->
      <div class="status-bar">
        <span class="status-time" id="clock">9:41</span>
        <div class="status-icons">
          <!-- Signal -->
          <svg viewBox="0 0 17 12"><rect x="0" y="3" width="3" height="9" rx="1"/><rect x="4.5" y="2" width="3" height="10" rx="1"/><rect x="9" y="0" width="3" height="12" rx="1" opacity=".3"/><rect x="13.5" y="0" width="3" height="12" rx="1" opacity=".3"/></svg>
          <!-- WiFi -->
          <svg viewBox="0 0 16 12"><path d="M8 9.5a1.5 1.5 0 110 3 1.5 1.5 0 010-3z"/><path d="M3.5 6.5A6.5 6.5 0 018 5a6.5 6.5 0 014.5 1.5" fill="none" stroke="#0F0F12" stroke-width="1.5" stroke-linecap="round"/><path d="M1 4A9.5 9.5 0 018 1.5 9.5 9.5 0 0115 4" fill="none" stroke="#0F0F12" stroke-width="1.5" stroke-linecap="round" opacity=".4"/></svg>
          <!-- Battery -->
          <svg viewBox="0 0 25 12"><rect x="0" y="1" width="21" height="10" rx="2.5" fill="none" stroke="#0F0F12" stroke-width="1"/><rect x="1.5" y="2.5" width="16" height="7" rx="1.5"/><path d="M22.5 4v4a2 2 0 000-4z"/></svg>
        </div>
      </div>

      <!-- The app iframe -->
      <iframe id="appFrame" src="https://khelo-india.vercel.app/onboarding/language" title="App Preview"></iframe>
    </div>
  </div>
</div>

<p class="hint">
  Running your app on a different port? Change the port above and hit Load.<br>
  Press <kbd>⌘R</kbd> to hard-refresh the frame.
</p>

<script>
  // Live clock
  function updateClock() {
    const now = new Date();
    const h = now.getHours();
    const m = String(now.getMinutes()).padStart(2,'0');
    document.getElementById('clock').textContent = `${h}:${m}`;
  }
  updateClock();
  setInterval(updateClock, 10000);

  // Load URL
  function loadUrl() {
    const base = document.getElementById('urlInput').value.trim().replace(/\/$/, '');
    const path = document.getElementById('pathInput') ? (document.getElementById('pathInput').value.trim() || '/') : '/';
    document.getElementById('appFrame').src = base + (path.startsWith('/') ? path : '/' + path);
  }

  // Quick route buttons
  function goRoute(path, btn) {
    document.querySelectorAll('.route-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const base = document.getElementById('urlInput').value.trim().replace(/\/$/, '');
    if (document.getElementById('pathInput')) {
      document.getElementById('pathInput').value = path === '/' ? '' : path;
    }
    document.getElementById('appFrame').src = base + path;
  }

  // Cmd+R refreshes the frame
  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'r') {
      e.preventDefault();
      document.getElementById('appFrame').src = document.getElementById('appFrame').src;
    }
  });
</script>
</body>
</html>
